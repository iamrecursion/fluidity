name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight redundant. Cancel it, except on
# main, where the run for each commit is the record that that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Formatting is checked on its own, without Nix and without a toolchain, so a
  # 101-character Markdown line costs fifteen seconds rather than a full build.
  # Everything else runs inside the flake devshell.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the devshell provides, so `make format` locally
      # produces exactly what this job accepts. nix.yml asserts the two agree;
      # when nixpkgs moves dprint, that check is what tells you to bump this.
      - uses: dprint/check@v2.3
        with:
          dprint-version: "0.55.2"

  # What Obsidian's plugin review actually runs: a clean checkout, plain npm,
  # and `npm run build`. No Nix, no make — so this fails the moment the build
  # starts depending on something the devshell happens to supply. The devshell
  # job below cannot catch that, because it has every tool a reviewer lacks.
  clean-build:
    name: Build without the devshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assert a bundle was produced
        run: |
          if [ ! -s main.js ]; then
            echo "::error::npm run build produced no main.js"
            exit 1
          fi
          echo "main.js is $(stat -c%s main.js) bytes."

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The devshell is this project's only description of its toolchain, and
      # every step below runs inside it via the same `make` targets a
      # contributor uses. A devshell that builds locally cannot silently fail
      # here, because there is no second toolchain to drift from it.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Cache the npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: make deps

      - name: Type-check
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      # These build the plugin for real, with the project's own esbuild config.
      # They are the reason a green run means the bundle's externals are still
      # what Obsidian actually provides, rather than what the list claims.
      - name: Integration tests
        run: make test-integration

      - name: Bundle
        run: make build

      # A plugin that patches the link completer has no business being large,
      # and the number in the summary is the cheapest way to notice when a
      # dependency arrives that disagrees.
      - name: Report the bundle size
        run: |
          {
            echo "### Build"
            echo
            echo "\`main.js\` is $(stat -c%s main.js) bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      # The three files Obsidian installs, so a reviewer can drop this build
      # straight into a vault without building it themselves.
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: fluidity-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
