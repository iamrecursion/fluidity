name: Feature request
description: Suggest something Fluidity should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a look first: the [roadmap](https://github.com/iamrecursion/fluidity/blob/main/docs/roadmap.md)
        lists what is planned, what is deliberately *not* planned, and the known limitations along
        with their causes. If your idea is on it, adding to that issue is more useful than a new one.

        In particular, Fluidity's casing rule is knowingly blunt — it lowercases the whole display
        text — and the answer to "it mangled *History of France*" is already written down there.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The situation, rather than the solution. What does the sentence look like, what link did you
        want in it, and what did you have to fix by hand? A concrete before-and-after is worth more
        than a general description.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: >
        If you have a shape in mind — a frontmatter property, a setting, a rule syntax — say so. If
        not, that is fine; the problem is the important half.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: >
        Other plugins, a workaround with the features that exist, or a reason none of them fits.
        This often shows where the real gap is.

  - type: dropdown
    id: surface
    attributes:
      label: Where would this happen?
      description: >
        Fluidity changes what the link completer inserts, and only that. It does not rewrite links
        already in your notes, and it does not touch how a link renders once written — those are
        different problems with different failure modes, and saying which one you mean up front
        saves a round trip.
      options:
        - "When picking a suggestion from the link completer"
        - "To links already written in my notes"
        - "To how a link is displayed rather than what is stored"
        - "Somewhere else, or not sure"
    validations:
      required: true
